# Render blueprint. Point Render at this repo and it provisions both services.
#
# ---------------------------------------------------------------- demo config
# Currently set to Render's free plans, for showing the app to people before
# committing to a paid instance. Two consequences, both worth knowing:
#
#   1. A free web service sleeps after ~15 minutes of inactivity. The first
#      request after that takes 30-60s to wake it, and a sleeping process runs
#      no cron — so the app's own 8am reminder scheduler will not fire.
#      Drive reminders from .github/workflows/reminders.yml instead; the
#      workflow retries while the instance wakes. See README §3.
#
#   2. Render's free Postgres is time-limited (30 days at the time of writing)
#      and is deleted when it expires, not downgraded. Fine for a demo, but do
#      not let it become the only record of a real gear fleet. Check Render's
#      current policy before relying on it.
#
# ------------------------------------------------------- switching to real use
# For the actual rollout, change two lines and redeploy:
#
#   databases[0].plan: free    ->  basic-256mb     (~$6/mo, automated backups)
#   services[0].plan:  free    ->  starter         (~$7/mo, never sleeps)
#
# On starter the built-in scheduler works and the GitHub Actions workflow
# becomes unnecessary — you can delete it or leave it, since the reminder batch
# de-duplicates per calendar day and double-triggering sends nothing twice.

databases:
  - name: cage-db
    databaseName: cage
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: cage
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cage-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TZ_NAME
        value: America/Chicago
      - key: APP_URL
        sync: false          # https://cage.onrender.com or your custom domain
      # Set this before the first deploy. These addresses become admins on
      # boot, which also means the people table is never empty — so the
      # "first person to sign in becomes admin" fallback can't hand admin to
      # a stranger while sign-in is open.
      - key: ADMIN_EMAILS
        sync: false          # comma separated
      # Blank allows any address to request a sign-in link — which is the
      # point during a demo. Set it to life.church for the real rollout.
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      # Must be an address you've verified with your mail provider, or the
      # provider will refuse the message. See README §1.
      - key: MAIL_FROM
        sync: false          # e.g. The Cage <cage@life.church>
      - key: SMTP_HOST
        sync: false          # smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # Brevo SMTP login, e.g. 8a1b2c001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false          # Brevo SMTP key — NOT your account password
      - key: CRON_SECRET
        generateValue: true  # copy this into the GitHub repo secrets too
