<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<meta name="description" content="Gear checkout and reservations for the Life.Church filmmaking team.">
<title>The Cage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Camera scanning fallback for browsers with no native BarcodeDetector —
     that's every browser on iOS, since Apple requires them all to run on
     WebKit regardless of what they're branded as. -->
<script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    /* Before first paint: reading this after boot flashes the dark theme at
       someone who chose light. Deliberately tiny and dependency-free. */
    try {
      /* Settings are per person, but nothing has asked the server who that is
      yet — ':last' records whoever used this device most recently, which is
      the best guess available this early. Boot corrects it. */
      var who = localStorage.getItem('the-cage-appearance:last');
      var a = JSON.parse(
      localStorage.getItem('the-cage-appearance:' + (who == null ? 'anon' : who))
      || localStorage.getItem('the-cage-appearance') || '{}');
      var s = { small: .85, normal: 1, large: 1.18, xlarge: 1.4 }[a.text] || 1;
      var e = document.documentElement;
      e.dataset.theme = a.theme === 'light' ? 'light' : 'dark';
      e.style.setProperty('--fs', String(s));
      e.style.setProperty('--fw', a.bold ? '600' : '400');
      e.style.setProperty('--fw-mid', a.bold ? '700' : '500');
      e.style.setProperty('--fw-bold', a.bold ? '700' : '600');
    } catch (err) {}
  </script>
</head>
<body>

<!-- ---------------------------------------------------------- sign in gate -->
<section class="gate" id="gate">
  <div class="gate-card">
    <h1>The Cage</h1>
    <p>Gear checkout for the filmmaking team. Enter your work email and we'll send a sign-in link.</p>
    <div class="field">
      <label class="lbl" for="gate-email">Email</label>
      <input id="gate-email" type="email" autocomplete="email" inputmode="email"
             autocapitalize="off" spellcheck="false" placeholder="you@life.church">
    </div>
    <button class="btn primary wide" data-act="request-link">Send sign-in link</button>
    <div id="gate-msg" style="margin-top:16px"></div>
  </div>
</section>

<!-- -------------------------------------------------------------- the app -->
<div class="app" id="app">
  <header>
    <div class="brand">
      <h1>The Cage</h1>
      <span class="tag" id="hdr-count"></span>
    </div>
    <div class="who">
      <button class="cart-btn" id="hdr-cart" data-act="open-cart" aria-label="Go to checkout">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"
             fill="none" stroke="currentColor" stroke-width="1.35"
             stroke-linecap="round" stroke-linejoin="round">
          <!-- The basket *is* the camera body: film reels on top, lens cone
               off the right. One shape doing both jobs reads far better at
               24px than a camera drawn inside a cart.
               Stroke weight is set against the reel radius, not by eye — at
               1.8 the stroke was 0.9x the smaller reel's radius and the holes
               filled in, so the reels read as dots. The reference sits nearer
               0.5x, which is what keeps them open.
               The cone starts exactly on the body's right edge: a 0.4 gap
               under a 1.35 stroke isn't a gap, it's a solid bar. -->
          <path d="M1.4 5.6h2.1l2.8 8"/>
          <path d="M6.6 6.9h11.9v6.7H6.6"/>
          <path d="M18.5 8.3 22.2 6.6v7.3l-3.7-1.7"/>
          <path d="M6.7 16.2h10.4"/>
          <circle cx="9.5" cy="5" r="2.1"/>
          <circle cx="14.8" cy="4.4" r="2.6"/>
          <circle cx="8.2" cy="19.1" r="1.7" fill="currentColor" stroke="none"/>
          <circle cx="15.6" cy="19.1" r="1.7" fill="currentColor" stroke="none"/>
        </svg>
        <span class="cart-n" id="hdr-cart-n">0</span>
      </button>
      <span class="no-auth" id="hdr-noauth" hidden>No sign-in</span>
      <span class="n" id="hdr-who"></span>
      <button class="btn small" id="hdr-signout" data-act="signout">Sign out</button>
      <button class="appearance-btn" data-act="appearance" aria-label="Appearance" title="Appearance">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <!-- Ring plus a half-filled inner disc: the contrast mark, which is
               what a light/dark switch means everywhere else. evenodd is what
               punches the hole through the ring. -->
          <path fill-rule="evenodd" d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm0 3.2a7.3 7.3 0 1 1 0 14.6 7.3 7.3 0 0 1 0-14.6Z"/>
          <path d="M12 7.4a4.6 4.6 0 0 0 0 9.2Z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="nav">
    <button data-tab="out">Check Out</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="reservations">Reservations</button>
    <!-- nav-more-item: on a phone these four live in the More sheet instead
         of a fifth-through-eighth bottom-bar tab; the desktop sidebar shows
         them same as always (see the min-width:900px rule in styles.css). -->
    <button data-tab="repairs" class="nav-more-item">Repairs</button>
    <button data-tab="packages" class="nav-more-item">Packages</button>
    <button data-tab="kits" class="nav-more-item">Kits</button>
    <button data-tab="admin" id="nav-admin" class="nav-more-item" hidden>Admin</button>
    <button id="nav-more" data-act="nav-more">More</button>
  </nav>

  <main id="view"></main>
</div>

<div class="scrim" id="scrim" data-act="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
